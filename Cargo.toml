[workspace]
resolver = "2"
members = ["crates/weathered-core", "crates/weathered"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"
authors = ["Weathered Contributors"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
futures = "0.3"
hex = "0.4"
md-5 = "0.11"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.30"
